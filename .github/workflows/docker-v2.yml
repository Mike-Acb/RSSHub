name: 'Docker v2'

on:
    push:
        branches:
            - twitter-v2
    workflow_dispatch: {}

permissions:
    contents: read
    packages: write

env:
    REGISTRY_IMAGE: ghcr.io/${{ github.repository }}-v2

jobs:
    build:
        if: github.ref == 'refs/heads/twitter-v2'
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        steps:
            - name: Prepare image and platform
              run: |
                  echo "IMAGE=${REGISTRY_IMAGE,,}" >> "$GITHUB_ENV"
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push image by digest
              id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  cache-from: type=gha,scope=docker-v2-${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=docker-v2-${{ env.PLATFORM_PAIR }}
                  outputs: type=image,name=${{ env.IMAGE }},compression=zstd,force-compression=true,push-by-digest=true,name-canonical=true,push=true

            - name: Export digest
              run: |
                  mkdir -p "${{ runner.temp }}/digests"
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: digests-v2-${{ env.PLATFORM_PAIR }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        if: github.ref == 'refs/heads/twitter-v2'
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 5
        steps:
            - name: Prepare image
              run: echo "IMAGE=${REGISTRY_IMAGE,,}" >> "$GITHUB_ENV"

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

            - name: Log in to GHCR
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Download digests
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-v2-*
                  merge-multiple: true

            - name: Create and push v2 manifest
              working-directory: ${{ runner.temp }}/digests
              run: |
                  digests=()
                  for digest in *; do
                      digests+=("${IMAGE}@sha256:${digest}")
                  done
                  docker buildx imagetools create -t "${IMAGE}:v2" "${digests[@]}"
